name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: The check script's tests
        run: npm test
      - name: This repository's skills pass the check
        run: npm run check

  # The same script with Bun's own YAML parser and no dependency installed.
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test skills/charter/templates/scripts/
      - run: bun skills/charter/templates/scripts/check-agent-files.mjs --skills skills

  # Bun with the yaml package present: the script must prefer yaml, Pi's parser.
  bun-with-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test skills/charter/templates/scripts/
