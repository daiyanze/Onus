goal: Anyone using Onus, a person or an agent, can appeal a problem with the method to this repository with one skill command, and the gaps found against pstack and other plugins are closed
record: docs/plans/self-improvement.md
issues:
  # M1: self-improvement. Riskiest first: the note format is a one-way door.
  - id: method-notes
    title: Every skill's last step records method notes
    milestone: M1 Self-improvement
    depends_on: []
    what: |
      As the record describes ("What counts as a method note", "Signals",
      "Where notes are written"):
      - Each of the six skills' last step gains a `### Method notes` subsection
        (each note, or `none`), after checking the eight signals: `charter` step 8,
        `cross-examine` step 8, `evidence-kit` step 4, and the Report step of the
        other three. No line offering `appeal` yet: that comes with `appeal`.
      - `cross-examine` step 7 template gains a `**Method notes:**` line.
      - `docs/development.md` step 7 (Learn) gains the lesson-or-method-note test;
        the Bug fix kind gains signal 8: name the PR that introduced the bug and
        the step that should have caught it.
      - `docket` gains the `method` log phase.
      Touches `skills/` and the charter templates, which projects copy as agent files.
    acceptance:
      - "`bun skills/charter/templates/scripts/check-agent-files.mjs --skills skills` prints `agent files ok`."
      - "`grep -c '^### Method notes' skills/*/SKILL.md` prints 1 for each of the six files, and `grep -c 'Method notes:' skills/cross-examine/SKILL.md` prints at least 1."
      - "`grep -rn 'appeal' skills/` prints nothing."
      - One `cross-examine` run on a real PR in an adopting project posts a comment with a `**Method notes:**` line, read back unchanged; its link is added to VALIDATION.md.

  - id: skill-version
    title: Each skill carries the Onus version in its frontmatter
    milestone: M1 Self-improvement
    depends_on: []
    what: |
      An appeal must say which wording it is about, and a copied skill folder
      has no package.json or git commit. Add `metadata: {onus-version: <x.y.z>}`
      to every SKILL.md (record, "Contract"), and a check in this repository's
      `npm run check` that fails when a skill lacks it or it differs from
      `package.json`'s version. README states that every change to a skill's
      wording bumps the version.
    acceptance:
      - "`npm test` passes, with a test that fails when a skill has no `onus-version` and one that fails when it differs from package.json."
      - "`bun skills/charter/templates/scripts/check-agent-files.mjs --skills skills` prints `agent files ok` with the new key (unknown frontmatter keys are allowed)."

  - id: appeal-intake
    title: An issue form, a label and a triage rule for appeals
    milestone: M1 Self-improvement
    depends_on: []
    what: |
      This repository's side ("What happens to an appeal here", "Contract"):
      `.github/ISSUE_TEMPLATE/appeal.yml` with the field ids in the contract and
      `labels: [appeal]`; the label `appeal`; and `CONTRIBUTING.md` with the
      triage outcomes and the proof rule: for a change in behaviour, the old
      wording as `onus@<ref>` and the new one under the same bench hash, pass
      counts at n >= 3 per cell; for a fix of a command, a missing file or a
      contradiction, a dry run of the step. The PR names the appeal it answers.
      Touches `.github/`.
    acceptance:
      - "`node -e \"require('yaml').parse(require('fs').readFileSync('.github/ISSUE_TEMPLATE/appeal.yml','utf8'))\"` exits 0 (or the same with `bun`), and the file holds every field id in the record's contract."
      - The GitHub new-issue page offers the Appeal form, and opening `issues/new?template=appeal.yml&title=test&skill=take-case` shows those values prefilled; a screenshot is in the PR.
      - The repository's labels page lists `appeal`.

  - id: appeal
    title: Add the appeal skill to submit a problem with the method to Onus
    milestone: M1 Self-improvement
    depends_on: [method-notes, skill-version, appeal-intake]
    what: |
      A seventh skill, `appeal`, shape B in the record ("The appeal skill"):
      intake from the person's words, this session's method notes, `method`
      rows in `.runs/` and `**Method notes:**` lines on the PRs they name; one
      question at a time; locate the skill, step and `onus-version`; tell a
      project lesson apart and offer `docs/lessons.md`; redact; list possible
      duplicates by title only; show every field as text and hand over the
      prefilled form link. Never submits. Callable by name only:
      `disable-model-invocation: true` and `agents/openai.yaml` with
      `allow_implicit_invocation: false`. Adds the line "Run `appeal` to send
      these to Onus." to each skill's `### Method notes` when it is not empty.
      README, README.zh-CN and the runtime table list it.
    acceptance:
      - "`ls skills/appeal/SKILL.md skills/appeal/agents/openai.yaml` lists both, and `grep -c 'allow_implicit_invocation: false' skills/appeal/agents/openai.yaml` prints 1."
      - "`bun skills/charter/templates/scripts/check-agent-files.mjs --skills skills` prints `agent files ok`."
      - In an adopting project, a person's one-sentence complaint produces a form link whose fields hold no project code, file contents or private links, and nothing is submitted by the agent; the transcript is linked in the PR.
      - A complaint that is a project lesson is answered as one, with an offer to add it to `docs/lessons.md`, and no link is produced.
      - One real appeal is submitted to daiyanze/Onus from a project other than this repository, and arrives with the `appeal` label.

  - id: bench-baseline
    title: Record a bench baseline for the current version
    milestone: M1 Self-improvement
    depends_on: []
    what: |
      `bench/RESULTS.md` says "No results yet". A first data point for the
      method, not a prerequisite for appeals (a new scenario changes the bench
      hash, so appeals re-run the old wording as `onus@<ref>`). Run the bench for the current version
      and the `none` arm on at least two runtimes, keep the result files, and
      regenerate RESULTS.md. Note the token cost per trial.
    acceptance:
      - "`node bench/report.mjs` regenerates RESULTS.md with rows for at least two runtimes and both arms, and `git diff --exit-code bench/RESULTS.md` is clean after it."
      - The bench README states the cost per trial measured in this run.

  - id: lessons-refresh
    title: Audit a project's lessons against its code
    milestone: M1 Self-improvement
    depends_on: []
    what: |
      `docs/development.md` "Lessons" says to retire, merge and promote, but
      nothing triggers it. Add a refresh step, run at the end of a `docket`
      run and when the file grows past a minute's read: each `Check:` line
      names a check that still exists and still fails on the mistake; each
      scope path still exists; duplicates merged; retired entries kept.
      Borrowed from Compound Engineering's learnings audit.
    acceptance:
      - "`npm run check` passes."
      - A dry run against Breaker Delta's `docs/lessons.md` lists each lesson with check present/absent and scope present/absent, and the list is pasted in the PR.

  # M2: gaps against pstack and others.
  - id: resume-case
    title: take-case resumes the agent's own unfinished pull request first
    milestone: M2 Gaps
    depends_on: []
    what: |
      `take-case` step 1 treats an issue with an open PR as "in progress" and
      skips it, so a single-issue session that stopped mid-review is never
      picked up outside `docket`. Before new candidates, list the agent's own
      open PRs whose latest review requests changes or whose CI failed, and
      resume the oldest. A resume reads the PR, the last review and CI, and
      checks inherited claims, as `docket` step 1 does. "The agent's own" is
      an open PR that closes an issue with the agent label: the agent posts
      under the person's account, so authorship cannot tell.
    acceptance:
      - "`npm run check` passes."
      - A dry run in a repository with one open agent PR carrying a request-changes verdict reports that PR as the resume point, not a new issue.

  - id: kinds-of-work
    title: Add refactoring, performance, investigation and spike to the kinds of work
    milestone: M2 Gaps
    depends_on: []
    what: |
      `docs/development.md` has three kinds of work. Add four, each with its
      proof, after pstack's playbooks:
      - Refactoring: behaviour unchanged, shown by tests that pass before and
        after with no test edited; callers migrated, then the old path deleted.
      - Performance: a measurement before and after on the same command,
        repeated, with the number explained (what dominates it).
      - Investigation: a question, answered with the commands that show it; no PR.
      - Spike: a throwaway branch, never merged; what it showed goes into the issue.
      `take-case` states the kind of the issue it picked in its first lines.
    acceptance:
      - "`npm run check` passes."
      - "`grep -E '^\\*\\*(Refactoring|Performance|Investigation|Spike)\\.\\*\\*' skills/charter/templates/docs/development.md` prints four lines."

  - id: blast-radius
    title: Explore lists what the change reaches before the plan
    milestone: M2 Gaps
    depends_on: []
    what: |
      Step 1 (Explore) gains: list the callers, consumers and stored data the
      change reaches, with the command that found them (a search, the type
      check, a query). The list goes into the PR's `## Scope`. After pstack's
      `blast-radius`.
    acceptance:
      - "`npm run check` passes."
      - "A bench run of `cp1` with arms `onus@<base SHA>` and `onus`, n >= 3 on one runtime, gives `onus` a pass count no lower than `onus@<base SHA>`; the command and RESULTS.md rows are in the PR."

  - id: second-model-run
    title: Run the second-model review once and name the review models
    milestone: M2 Gaps
    depends_on: []
    what: |
      VALIDATION.md lists "Second model review" as written, never done. Let
      `AGENTS.md` name the review models (`charter` asks), after pstack's
      models per role, and run `cross-examine` with a second vendor's model on
      one real PR in an adopting project.
    acceptance:
      - A review comment whose `**Second model:**` line names a model from another vendor, linked in VALIDATION.md with what it found that the first model did not, or "nothing".
      - "`grep -n 'Review models' skills/charter/templates/AGENTS.template.md skills/charter/SKILL.md` prints a line in each."
      - "`npm run check` passes."

  - id: delegate-rules
    title: Rules for subagents the writer starts
    milestone: M2 Gaps
    depends_on: []
    what: |
      Reviewers and challengers have rules; helpers the writer starts (to
      search, to try a probe, to build one unit) do not. Add to
      `docs/development.md`: a delegate reads `AGENTS.md` and `docs/lessons.md`,
      gets one unit with its check, reports commands and results, and never
      opens a PR, pushes or merges; the writer checks its claims against the
      code. After pstack's `poteto-agent` and superpowers' subagent-driven development.
    acceptance:
      - "`npm run check` passes."
      - "`grep -n 'delegate' skills/charter/templates/docs/development.md` shows the new section."
